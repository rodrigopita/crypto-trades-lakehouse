services:
  ingester:
    build:
      context: .
      target: ingestion
    command: python -m ingestion.ingester
    volumes:
      - ./data:/app/data
    restart: "no"

  processor:
    build:
      context: .
      target: processing
    command: python -m processing.main
    volumes:
      - ./data:/app/data
    restart: "no"
